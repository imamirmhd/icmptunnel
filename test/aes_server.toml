# AES-256-GCM encrypted server config
listen = "0.0.0.0"
auth_tokens = ["test-token-12345"]

[icmp]
max_packet_size = 1472
read_timeout = "5s"
write_timeout = "5s"

[encryption]
enabled = true
method = "aes-256-gcm"
key = "33c04c5cda9f9135a1511c4bb73393992d69873eeb1570784dea14bb01383636"

[firewall]
disable_echo_reply = true
enable_forwarding = true

[transport]
window_size = 100

[logging]
level = "error"
output = "stdout"

# ICMP Tunnel Client Configuration

# Main server IP address
server_addr = "203.0.113.1"

# Authentication token (must match one in server's auth_tokens list)
auth_token = "your-auth-token-here"

# ─── ICMP Settings ───────────────────────────────────────────────────────────
[icmp]
max_packet_size = 1472
ttl = 64
read_timeout = "5s"
write_timeout = "5s"
sequence_start = 0
id_range = [1, 65535]

# ─── Encryption ──────────────────────────────────────────────────────────────
[encryption]
enabled = true
method = "aes-256-gcm"    # Options: aes-256-gcm, chacha20-poly1305, xor
key = "must-match-server-key"

# ─── SOCKS5 Proxies ──────────────────────────────────────────────────────────
# Define one or more SOCKS5 proxy listeners

[[socks5]]
listen = "127.0.0.1:1080"
# No auth for this proxy

[[socks5]]
listen = "127.0.0.1:1081"
username = "user"
password = "pass"

# ─── Port Forwarding Rules ───────────────────────────────────────────────────
# Forward local ports to remote destinations through the ICMP tunnel

[[forwards]]
listen = "127.0.0.1:8080"
destination = "internal.server:80"
protocol = "tcp"

[[forwards]]
listen = "127.0.0.1:5353"
destination = "8.8.8.8:53"
protocol = "udp"

# ─── DPI Evasion ─────────────────────────────────────────────────────────────
[evasion.fragmentation]
enabled = false
max_fragment_size = 512

[evasion.padding]
enabled = true
min_size = 8
max_size = 64

[evasion.jitter]
enabled = true
min_delay = "10ms"
max_delay = "100ms"

[evasion.mimicry]
enabled = true
os_signature = "linux"    # Options: linux, windows, macos

[evasion.checksum]
enabled = false

[evasion.adaptive_size]
enabled = false
min_size = 64
max_size = 1400
step_size = 64

# ─── ICMP Spoofing ───────────────────────────────────────────────────────────
[spoof]
enabled = false
relay_addr = "198.51.100.1"     # Relay server IP
route_via_relay = false          # true = responses via relay, false = direct

# ─── Logging ─────────────────────────────────────────────────────────────────
[logging]
level = "info"
output = "stdout"

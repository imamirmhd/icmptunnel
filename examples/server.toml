# ICMP Tunnel Server Configuration

# Server listen address (0.0.0.0 for all interfaces)
listen = "0.0.0.0"

# Authorized client tokens (generate with: icmptunnel keygen --token)
auth_tokens = [
    "your-auth-token-here"
]

# ─── ICMP Settings ───────────────────────────────────────────────────────────
[icmp]
max_packet_size = 1472    # Maximum ICMP payload size (MTU - IP header)
ttl = 64                  # IP Time-To-Live
read_timeout = "5s"       # Socket read timeout
write_timeout = "5s"      # Socket write timeout
sequence_start = 0        # Starting sequence number
id_range = [1, 65535]     # ICMP ID range

# ─── Encryption ──────────────────────────────────────────────────────────────
[encryption]
enabled = true
method = "aes-256-gcm"    # Options: aes-256-gcm, chacha20-poly1305, xor
key = "generate-with-icmptunnel-keygen"

# ─── Firewall Settings ───────────────────────────────────────────────────────
[firewall]
disable_echo_reply = true   # Prevent kernel from replying to ICMP pings
enable_forwarding = true    # Enable IP forwarding for traffic routing

# ─── DPI Evasion ─────────────────────────────────────────────────────────────
[evasion.fragmentation]
enabled = false
max_fragment_size = 512

[evasion.padding]
enabled = false
min_size = 8
max_size = 64

[evasion.jitter]
enabled = false
min_delay = "10ms"
max_delay = "100ms"

[evasion.mimicry]
enabled = false
os_signature = "linux"    # Options: linux, windows, macos

[evasion.checksum]
enabled = false

[evasion.adaptive_size]
enabled = false
min_size = 64
max_size = 1400
step_size = 64

# ─── Relay / Spoofing Support ────────────────────────────────────────────────
[relay]
enabled = false           # Enable to accept spoofed ICMP packets

# ─── Transport Settings ──────────────────────────────────────────────────────
[transport]
window_size = 100         # Sliding window size (packets in flight)
max_payload = 1400        # Maximum tunnel payload size
retransmission_timeout = "200ms"
compression = true        # LZ4-style streaming compression
stream_count = 4          # Number of parallel logical streams
pacing_aggressiveness = 5 # 1-10 rate control

# ─── Logging ─────────────────────────────────────────────────────────────────
[logging]
level = "info"            # Options: debug, info, warn, error
output = "stdout"         # Options: stdout, stderr, or file path

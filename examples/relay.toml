# ICMP Tunnel Relay Server Configuration
# The relay server is used for ICMP spoofing scenarios where the client
# cannot directly reach the main server.

# Listen address (0.0.0.0 for all interfaces)
listen = "0.0.0.0"

# Allowed source IP addresses or CIDRs (empty = allow all)
allowed_sources = []

# Maximum packets per second per source IP
rate_limit = 1000

# ─── Logging ─────────────────────────────────────────────────────────────────
[logging]
level = "info"
output = "stdout"
